<script>
  const content = document.getElementById('content');

  const data = {
    "Book 1": {
      "Unit 1": {
        "Section 1": {
          quote: "The betterment of the world can be accomplished through pure and goodly deeds, through commendable and seemly conduct.",
          author: "Bahá’u’lláh",
          questions: [
            "What does Bahá’u’lláh mean by \"pure and goodly deeds\"?",
            "How can our conduct contribute to the betterment of the world?",
            "Share an example from your life or community."
          ]
        },
        "Section 2": {
          quote: "Various quotations from Section 1 were read, and now participants are invited to reflect on those through simple exercises.",
          author: "Ruhi Institute",
          questions: [
            "Which of the following are commendable? (e.g., To be a good worker, To serve others)",
            "What does the phrase 'ere thou art summoned to a reckoning' mean?",
            "Which of these statements are true?\n- There are so few good people...\n- Something is correct when in agreement with the teachings of God",
            "Which of the following are pure and goodly deeds? (e.g., Praying for others, Helping others selflessly)",
            "In which situations do words differ from deeds? (e.g., Someone says we should be united but causes conflict)",
            "Is it permissible for a Bahá’í to confess to another person?",
            "What should he or she do instead of confessing?",
            "What does 'the heaven of celestial glory' mean?",
            "What effect do bad deeds have on the world?",
            "What effect do bad deeds have on those who commit them?"
          ]
        }
      }
    }
  };

  function updateContent() {
    const book = document.getElementById('bookSelect').value;
    const unit = document.getElementById('unitSelect').value;
    const section = document.getElementById('sectionSelect').value;

    const sectionData = data?.[book]?.[unit]?.[section];

    if (!sectionData) {
      content.innerHTML = `<h2>${book} → ${unit} → ${section}</h2><p>Content not available yet.</p>`;
      return;
    }

    content.innerHTML = `
      <h2>${book} → ${unit} → ${section}</h2>
      <div class="quote">“${sectionData.quote}”</div>
      <div class="author">—${sectionData.author}</div>
      <h3>Discussion Questions:</h3>
      <ul>
        ${sectionData.questions.map(q => `<li>${q}</li>`).join('')}
      </ul>
    `;
  }

  document.getElementById('bookSelect').addEventListener('change', updateContent);
  document.getElementById('unitSelect').addEventListener('change', updateContent);
  document.getElementById('sectionSelect').addEventListener('change', updateContent);
</script>
